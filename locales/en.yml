en:
  theme_metadata:
    description: "Replaces the sidebar with a single Discord-style channel list made of categories, chat channels and voice rooms."
    settings:
      include_tags: "List the user's sidebar tags as channels. Off by default for now."
      include_chat_channels: "List followed chat channels as channels (requires chat)."
      sidebar_sections:
        description: "Headed sections the channel list is split into, and the channels in each. The create-channel modal adds to these; channels in no section are listed at the top, without a heading."
        schema:
          properties:
            name:
              label: "Name"
            channels:
              label: "Channels"
              schema:
                properties:
                  type:
                    label: "Type"
                  id:
                    label: "ID"
                    description: "Category ID for forum, chat channel ID for text, room ID for voice, tag ID for tag."
      member_list_roles: "Groups shown as roles in the member list, in this order. Their online members get a section each, above everyone else."
      chat_container_category: "Slug of the category that holds the categories backing chat channels made from the create-channel modal. It's created if missing, and hidden from the channel list."
  create_channel:
    action: "Create channel"
    title: "Create channel"
    type: "Channel type"
    types:
      text:
        title: "Text"
        description: "Send messages, images, GIFs, emoji and opinions"
      voice:
        title: "Voice"
        description: "Hang out together with voice, video and screen share"
      forum:
        title: "Forum"
        description: "Create a space for organized discussions"
    section: "Section"
